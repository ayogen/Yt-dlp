name: Publish Android Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign and Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Release Keystore from Secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Required secret KEYSTORE_BASE64 is missing or empty."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/transcode-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to decode release keystore or file is empty."
            exit 1
          fi

          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "Keystore successfully restored to secure runner temporary path."

      - name: Build and Sign Android Release APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4096m"
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::One or more required signing secrets (KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are missing."
            exit 1
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Locate, Verify Signature, and Calculate Checksum
        id: prepare_apk
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          # Determine tag name
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$TAG_NAME" ] || [ "$GITHUB_REF_TYPE" != "tag" ]; then
            if [ -n "$INPUT_TAG" ]; then
              TAG_NAME="$INPUT_TAG"
            else
              TAG_NAME=$(echo "${GITHUB_REF}" | sed -e 's,.*/\(.*\),\1,')
            fi
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "::error::Unable to determine Git tag name for release."
            exit 1
          fi

          echo "Release Tag: ${TAG_NAME}"

          # Locate the built Release APK
          APK_SOURCE=""
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          else
            APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          fi

          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release/"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_SOURCE" 2>/dev/null || stat -f%z "$APK_SOURCE" 2>/dev/null || echo "0")
          if [ "$APK_SIZE" -le 0 ]; then
            echo "::error::Generated Release APK at $APK_SOURCE is empty (0 bytes)."
            exit 1
          fi

          echo "Release APK found: $APK_SOURCE (${APK_SIZE} bytes)"

          # Verify signature using apksigner or keytool
          echo "Verifying APK signature..."
          if [ -n "$ANDROID_SDK_ROOT" ] || [ -n "$ANDROID_HOME" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            APKSIGNER=$(find "$SDK_ROOT/build-tools" -name "apksigner" -type f | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              echo "Found apksigner at $APKSIGNER"
              $APKSIGNER verify --verbose "$APK_SOURCE"
            else
              echo "apksigner not found, verifying signature with jarsigner / unzip..."
              jarsigner -verify -verbose -certs "$APK_SOURCE" | grep -q "jar verified" || {
                echo "::error::APK signature verification failed with jarsigner."
                exit 1
              }
            fi
          else
            jarsigner -verify -verbose -certs "$APK_SOURCE" | grep -q "jar verified" || {
              echo "::error::APK signature verification failed."
              exit 1
            }
          fi
          echo "✓ APK signature verified successfully."

          # Copy and rename artifact
          TARGET_APK="Transcode-${TAG_NAME}.apk"
          cp "$APK_SOURCE" "$TARGET_APK"

          # Calculate SHA-256 Checksum
          CHECKSUM_FILE="${TARGET_APK}.sha256"
          sha256sum "$TARGET_APK" > "$CHECKSUM_FILE"
          SHA256_HASH=$(cut -d' ' -f1 "$CHECKSUM_FILE")

          echo "Target APK: $TARGET_APK"
          echo "SHA-256 Checksum: $SHA256_HASH"
          cat "$CHECKSUM_FILE"

          echo "apk_path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256_HASH" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Clean Temporary Keystore
        if: always()
        run: |
          KEYSTORE_PATH="${{ steps.keystore.outputs.keystore_path }}"
          if [ -n "$KEYSTORE_PATH" ] && [ -f "$KEYSTORE_PATH" ]; then
            shred -u "$KEYSTORE_PATH" 2>/dev/null || rm -f "$KEYSTORE_PATH"
            echo "Temporary keystore removed securely."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Transcode ${{ steps.prepare_apk.outputs.tag_name }}
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
            ${{ steps.prepare_apk.outputs.checksum_path }}
          body: |
            ## Transcode Android Application - ${{ steps.prepare_apk.outputs.tag_name }}

            Official signed release package for Android.

            ### 📦 Download & Artifacts
            - **Signed APK:** `${{ steps.prepare_apk.outputs.apk_path }}`
            - **SHA-256 Checksum:** `${{ steps.prepare_apk.outputs.sha256 }}`
            - **Checksum File:** `${{ steps.prepare_apk.outputs.checksum_path }}`

            ### ✨ Key Capabilities
            - **Core yt-dlp Extractor:** Integrated Android Python runtime with verified runtime execution and stable updates.
            - **FFmpeg Processing Engine:** High-performance native media muxing, format conversion, and multi-stream audio/video combining.
            - **Multi-Platform Extractor:** Robust media downloads for YouTube, Facebook, Instagram, TikTok, and supported sites.
            - **Scoped Storage & SAF:** Persistent custom download directories using Android Storage Access Framework with permission retention across process death.
            - **Engine Diagnostics & Management:** Real-time health monitoring, connectivity checks, and clean reinstallation tools.

            ### ⚙️ Build & Target Environment
            - **Target Platform:** Android 16 (API 36) / Minimum Android 7.0 (API 24)
            - **Package Type:** Signed Android Application Package (Release)
            - **Open Source:** Full source code and reproducible builds on GitHub.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
